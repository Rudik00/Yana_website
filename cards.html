<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карточки — Обучение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 10px 0 20px 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            padding-left: 15px;
            box-sizing: border-box;
        }
        .back-menu {
            padding: 8px 12px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .card-container {
            perspective: 1000px;
            width: 90vw;
            max-width: 340px;
            height: 55vh;
            max-height: 430px;
            cursor: pointer;
            margin: auto 0;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-radius: 14px;
            padding: 20px 16px;
            box-sizing: border-box;
            text-align: center;
        }
        /* Класс для режима без фото: элементы центрируются внутри неизменного окна */
        .card-face.no-photo {
            justify-content: center !important;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: #fff3cd;
            color: #856404;
            font-size: 17px;
            line-height: 1.5;
            justify-content: center;
            overflow-y: auto;
        }
        .card-face img {
            width: 100%;
            height: 72%;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 5px;
        }
        .card-face h2 {
            font-size: 18px;
            color: #333;
            margin: 10px 0 5px 0;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .btn {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        .counter {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-menu">← В меню</a>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <div class="card-face card-front" id="cardFrontFace">
                <img id="cardImage" src="" alt="Фото">
                <h2 id="cardName">Загрузка...</h2>
            </div>
            <div class="card-face card-back">
                <div id="cardCompound">Состав...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="backBtn">Назад</button>
        <div class="counter" id="counter">Карточка 0 из 0</div>
    </div>

    <script>
        let cardsData = [];
        let currentIndex = 0;
        let isFlipped = false;
        let photoMode = localStorage.getItem('photoMode') !== 'off';

        const cardElement = document.getElementById('card');
        const cardContainer = document.getElementById('cardContainer');
        const cardImage = document.getElementById('cardImage');
        const cardName = document.getElementById('cardName');
        const cardFrontFace = document.getElementById('cardFrontFace');
        const cardCompound = document.getElementById('cardCompound');
        const backBtn = document.getElementById('backBtn');
        const counter = document.getElementById('counter');

        // Применяем режим отображения фото сразу
        if (!photoMode) {
            cardImage.style.display = 'none';
            cardFrontFace.classList.add('no-photo');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadData() {
            try {
                const response = await fetch('bd.json');
                cardsData = await response.json();
                shuffle(cardsData);
                showCard();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                cardName.textContent = 'Ошибка загрузки bd.json';
            }
        }

        function showCard() {
            if (cardsData.length === 0) return;
            const item = cardsData[currentIndex];
            
            if (photoMode) {
                cardImage.src = `foto/${item.id}.jpg`;
                cardImage.onerror = () => { cardImage.src = 'https://via.placeholder.com/250?text=No+Photo'; };
            }
            
            cardName.textContent = item.name;
            cardCompound.textContent = item.compound;
            
            isFlipped = false;
            cardElement.classList.remove('flipped');
            counter.textContent = `Карточка ${currentIndex + 1} из ${cardsData.length}`;
        }

        cardContainer.addEventListener('click', () => {
            if (!isFlipped) {
                isFlipped = true;
                cardElement.classList.add('flipped');
            } else {
                if (currentIndex < cardsData.length - 1) {
                    currentIndex++;
                    showCard();
                } else {
                    currentIndex = 0;
                    shuffle(cardsData);
                    showCard();
                }
            }
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isFlipped) {
                isFlipped = false;
                cardElement.classList.remove('flipped');
            } else {
                if (currentIndex > 0) {
                    currentIndex--;
                    showCard();
                }
            }
        });

        loadData();
    </script>
</body>
</html>
