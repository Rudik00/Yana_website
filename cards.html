<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки — Обучение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .back-menu {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-menu:hover {
            background-color: #5a6268;
        }
        .card-container {
            perspective: 1000px;
            width: 320px;
            height: 450px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: #fff3cd;
            color: #856404;
            font-size: 18px;
            line-height: 1.5;
        }
        .card-face img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .card-face h2 {
            font-size: 20px;
            color: #333;
            margin: 0;
        }
        .controls {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .counter {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-menu">← В меню</a>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <div class="card-face card-front">
                <img id="cardImage" src="" alt="Фото">
                <h2 id="cardName">Загрузка...</h2>
            </div>
            <div class="card-face card-back">
                <div id="cardCompound">Состав...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="backBtn">Назад</button>
    </div>
    <div class="counter" id="counter">Карточка 0 из 0</div>

    <script>
        let cardsData = [];
        let currentIndex = 0;
        let isFlipped = false;

        const cardElement = document.getElementById('card');
        const cardContainer = document.getElementById('cardContainer');
        const cardImage = document.getElementById('cardImage');
        const cardName = document.getElementById('cardName');
        const cardCompound = document.getElementById('cardCompound');
        const backBtn = document.getElementById('backBtn');
        const counter = document.getElementById('counter');

        // Перемешивание массива (Fisher-Yates) по id
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadData() {
            try {
                const response = await fetch('bd.json');
                cardsData = await response.json();
                shuffle(cardsData);
                showCard();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                cardName.textContent = 'Ошибка загрузки bd.json';
            }
        }

        function showCard() {
            if (cardsData.length === 0) return;
            const item = cardsData[currentIndex];
            cardImage.src = `foto/${item.id}.jpg`;
            cardImage.onerror = () => { cardImage.src = 'https://via.placeholder.com/250?text=No+Photo'; };
            cardName.textContent = item.name;
            cardCompound.textContent = item.compound;
            
            isFlipped = false;
            cardElement.classList.remove('flipped');
            counter.textContent = `Карточка ${currentIndex + 1} из ${cardsData.length}`;
        }

        // Клик по карточке
        cardContainer.addEventListener('click', () => {
            if (!isFlipped) {
                // 1-й клик: переворот на состав
                isFlipped = true;
                cardElement.classList.add('flipped');
            } else {
                // 2-й клик: переход к следующей карточке
                if (currentIndex < cardsData.length - 1) {
                    currentIndex++;
                    showCard();
                } else {
                    currentIndex = 0;
                    shuffle(cardsData);
                    showCard();
                }
            }
        });

        // Кнопка назад
        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isFlipped) {
                // Перевернуть обратно на лицо
                isFlipped = false;
                cardElement.classList.remove('flipped');
            } else {
                // Вернуть прошлую карточку
                if (currentIndex > 0) {
                    currentIndex--;
                    showCard();
                }
            }
        });

        loadData();
    </script>
</body>
</html>
