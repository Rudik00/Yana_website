<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное меню — Обучение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Единый фон на всю страницу, растягивающийся по масштабу */
        .menu-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
            opacity: 0.85; /* Легкое затемнение для читаемости меню */
        }

        /* По умолчанию (для ноутбуков и широких экранов) показываем horizontal.jpg из папки mem */
        .bg-vertical {
            display: none;
        }
        .bg-horizontal {
            display: block;
        }

        /* Центральная панель уменьшена на 30% */
        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            padding: 24px 18px;
            border-radius: 11px;
            box-shadow: 0 6px 21px rgba(0,0,0,0.2);
            max-width: 238px;
            width: 60%;
            z-index: 1;
            border: 2px solid rgba(255,255,255,0.8);
        }
        h1 {
            color: #333;
            margin-bottom: 18px;
            font-size: 15px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 13px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 3px 7px rgba(0,123,255,0.3);
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background-color: #0056b3;
        }
        .menu-btn.test {
            background-color: #28a745;
            box-shadow: 0 3px 7px rgba(40,167,69,0.3);
        }
        .menu-btn.test:hover {
            background-color: #218838;
        }
        .menu-btn.settings {
            background-color: #6c757d;
            box-shadow: 0 3px 7px rgba(108,117,125,0.3);
            font-size: 11px;
            padding: 8px;
        }
        .menu-btn.settings:hover {
            background-color: #5a6268;
        }

        /* При переходе на узкие экраны (телефоны) меняем фон на vertical.jpg из папки mem */
        @media (max-width: 768px) {
            .bg-horizontal {
                display: none;
            }
            .bg-vertical {
                display: block;
            }
            .menu-container {
                padding: 18px 14px;
                width: 57%;
            }
        }
    </style>
</head>
<body>
    <!-- Пути обновлены: картинки теперь берутся из папки mem -->
    <img src="mem/horizontal.jpg" class="menu-background bg-horizontal" alt="">
    <img src="mem/vertical.jpg" class="menu-background bg-vertical" alt="">

    <div class="menu-container">
        <h1>📚 Меню обучения</h1>
        <a href="cards.html" class="menu-btn">Карточки</a>
        <a href="test.html" class="menu-btn test">Тест</a>
        <a href="settings.html" class="menu-btn settings">⚙️ Настройки</a>
    </div>
</body>
</html>
