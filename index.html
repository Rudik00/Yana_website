<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное меню — Обучение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .menu-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none; /* Чтобы стикеры не перекрывали клики */
        }
        .menu-sticker {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.25);
        }

        /* Десктопные позиции */
        .sticker-1 { top: 20px; left: 20px; }
        .sticker-2 { top: 20px; right: 20px; }
        .sticker-3 { bottom: 20px; left: 20px; }
        .sticker-4 { bottom: 20px; right: 20px; }
        .sticker-5 { top: 20px; left: 50%; transform: translateX(-50%); }
        .sticker-6 { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .sticker-7 { top: 50%; left: 20px; transform: translateY(-50%); }
        .sticker-8 { top: 50%; right: 20px; transform: translateY(-50%); }
        .sticker-9 { top: 15%; left: 140px; }
        .sticker-10 { top: 15%; right: 140px; }
        .sticker-11 { bottom: 15%; left: 140px; }
        .sticker-12 { bottom: 15%; right: 140px; }

        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95); /* Плотный фон, чтобы текст легко читался поверх мемов */
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 80%;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .menu-btn.test {
            background-color: #28a745;
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ: стикеры уменьшаются и остаются видны по краям */
        @media (max-width: 768px) {
            .menu-sticker {
                width: 50px;
                height: 50px;
                border: 2px solid white;
                border-radius: 8px;
                box-shadow: 1px 1px 5px rgba(0,0,0,0.2);
            }
            .sticker-1 { top: 8px; left: 8px; }
            .sticker-2 { top: 8px; right: 8px; }
            .sticker-3 { bottom: 8px; left: 8px; }
            .sticker-4 { bottom: 8px; right: 8px; }
            .sticker-5 { top: 8px; left: 50%; transform: translateX(-50%); }
            .sticker-6 { bottom: 8px; left: 50%; transform: translateX(-50%); }
            .sticker-7 { top: 50%; left: 8px; transform: translateY(-50%); }
            .sticker-8 { top: 50%; right: 8px; transform: translateY(-50%); }
            .sticker-9 { top: 22%; left: 10px; }
            .sticker-10 { top: 22%; right: 10px; }
            .sticker-11 { bottom: 22%; left: 10px; }
            .sticker-12 { bottom: 22%; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="menu-background">
        <img src="mem/1.1.jpeg" class="menu-sticker sticker-1" alt="">
        <img src="mem/1.2.jpeg" class="menu-sticker sticker-2" alt="">
        <img src="mem/1.3.jpeg" class="menu-sticker sticker-3" alt="">
        <img src="mem/1.4.jpeg" class="menu-sticker sticker-4" alt="">
        <img src="mem/1.5.jpeg" class="menu-sticker sticker-5" alt="">
        <img src="mem/1.6.jpeg" class="menu-sticker sticker-6" alt="">
        <img src="mem/1.7.jpeg" class="menu-sticker sticker-7" alt="">
        <img src="mem/1.8.jpeg" class="menu-sticker sticker-8" alt="">
        <img src="mem/1.9.jpeg" class="menu-sticker sticker-9" alt="">
        <img src="mem/1.10.jpeg" class="menu-sticker sticker-10" alt="">
        <img src="mem/1.11.jpeg" class="menu-sticker sticker-11" alt="">
        <img src="mem/1.12.jpeg" class="menu-sticker sticker-12" alt="">
    </div>

    <div class="menu-container">
        <h1>📚 Меню обучения</h1>
        <a href="cards.html" class="menu-btn">1 — Карточки</a>
        <a href="test.html" class="menu-btn test">2 — Тест</a>
    </div>
</body>
</html>
