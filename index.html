<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное меню — Обучение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* --- ФОНОВЫЙ КОЛЛАЖ (CSS Grid на весь экран) --- */
        .menu-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            /* 4 колонки и 4 строки покрывают весь экран */
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
            z-index: -1;
            pointer-events: none;
        }

        .menu-sticker {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            opacity: 0.85; /* Легкое затемнение, чтобы меню читалось еще лучше */
        }

        /* Оставляем центр пустым (там будет меню), скрывая центральные элементы сетки под меню */
        .center-plug {
            visibility: hidden;
        }

        /* --- ЦЕНТРАЛЬНОЕ МЕНЮ --- */
        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 340px;
            width: 85%;
            z-index: 1;
            border: 2px solid rgba(255,255,255,0.8);
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background-color: #0056b3;
        }
        .menu-btn.test {
            background-color: #28a745;
            box-shadow: 0 4px 10px rgba(40,167,69,0.3);
        }
        .menu-btn.test:hover {
            background-color: #218838;
        }

        /* Адаптация сетки для мобильных телефонов */
        @media (max-width: 768px) {
            .menu-background {
                gap: 6px;
                padding: 6px;
            }
            .menu-container {
                padding: 25px 20px;
                width: 82%;
            }
        }
    </style>
</head>
<body>
    <!-- Фоновый коллаж из 16 ячеек (12 фото + 4 пустых по центру для меню) -->
    <div class="menu-background">
        <img src="mem/1.1.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.2.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.3.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.4.jpeg" class="menu-sticker" alt="">
        
        <img src="mem/1.5.jpeg" class="menu-sticker" alt="">
        <div class="center-plug"></div>
        <div class="center-plug"></div>
        <img src="mem/1.6.jpeg" class="menu-sticker" alt="">
        
        <img src="mem/1.7.jpeg" class="menu-sticker" alt="">
        <div class="center-plug"></div>
        <div class="center-plug"></div>
        <img src="mem/1.8.jpeg" class="menu-sticker" alt="">
        
        <img src="mem/1.9.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.10.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.11.jpeg" class="menu-sticker" alt="">
        <img src="mem/1.12.jpeg" class="menu-sticker" alt="">
    </div>

    <!-- Основное меню -->
    <div class="menu-container">
        <h1>📚 Меню обучения</h1>
        <a href="cards.html" class="menu-btn">1 — Карточки</a>
        <a href="test.html" class="menu-btn test">2 — Тест</a>
    </div>
</body>
</html>
